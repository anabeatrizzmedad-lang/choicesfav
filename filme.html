<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineFavorito</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #141414;
            color: white;
        }

        header {
            background-color: #e50914;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            margin: 0;
        }

        .container {
            width: 90%;
            max-width: 450px;
            margin: 40px auto;
            background-color: #222;
            padding: 25px;
            border-radius: 12px;
            box-sizing: border-box;
        }

        h2 {
            text-align: center;
            color: #ff424b;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #555;
            border-radius: 6px;
            background-color: #333;
            color: white;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 25px;
            background-color: #e50914;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background-color: #b80710;
        }

        #resultado {
            display: none;
            margin-top: 25px;
            padding: 18px;
            background-color: #333;
            border-radius: 8px;
            line-height: 1.8;
        }

        #capa {
            display: block;
            width: 180px;
            max-height: 270px;
            object-fit: cover;
            margin: 15px auto;
            border-radius: 8px;
        }

        #mensagem {
            color: #ffcc45;
            font-weight: bold;
        }

        footer {
            text-align: center;
            color: #888;
            padding: 20px;
        }
    </style>
</head>

<body>

    <header>
        <h1>🎬 CineFavorito</h1>
        <p>Cadastre e avalie seus filmes favoritos!</p>
    </header>

    <div class="container">

        <h2>🍿 Meu Filme Favorito</h2>

        <label for="nome">Nome do filme:</label>
        <input type="text" id="nome" placeholder="Ex: Interestelar">

        <label for="ano">Ano de lançamento:</label>
        <input type="number" id="ano" placeholder="Ex: 2014">

        <label for="nota">Sua nota (1 a 10):</label>
        <input type="number" id="nota" placeholder="Ex: 9" min="1" max="10" step="0.1">

        <label for="imagem">Link da capa do filme:</label>
        <input type="url" id="imagem" placeholder="Cole o link da imagem">

        <button onclick="cadastrarFilme()">Cadastrar Filme</button>

        <div id="resultado">

            <h2>🎥 Resultado do Cadastro</h2>

            <img id="capa" src="" alt="Capa do filme" style="display: none;">

            <p id="exibirNome"></p>
            <p id="exibirAno"></p>
            <p id="exibirNota"></p>
            <p id="exibirIdade"></p>
            <p id="mensagem"></p>

        </div>

    </div>

    <footer>
        <p>© 2026 - CineFavorito | Feito por um amante de cinema ❤️</p>
    </footer>

    <script>

        function cadastrarFilme() {

            let nome = document.getElementById("nome").value.trim();
            let ano = Number(document.getElementById("ano").value);
            let nota = Number(document.getElementById("nota").value);
            let imagem = document.getElementById("imagem").value;

            let anoAtual = new Date().getFullYear();

            if (nome === "" || !document.getElementById("ano").value ||
                !document.getElementById("nota").value) {
                alert("Preencha todos os campos obrigatórios!");
                return;
            }

            if (ano < 1888 || ano > anoAtual) {
                alert("Informe um ano válido!");
                return;
            }

            if (nota < 1 || nota > 10) {
                alert("A nota deve estar entre 1 e 10!");
                return;
            }

            let idade = anoAtual - ano;
            let mensagem = "";

            if (nota >= 8) {
                mensagem = "✅ Filme muito recomendado!";
            }
            else if (nota < 5) {
                mensagem = "⚠️ Talvez você não tenha gostado muito desse filme.";
            }

            document.getElementById("exibirNome").innerHTML =
                "🎬 <strong>Filme:</strong> " + nome;

            document.getElementById("exibirAno").innerHTML =
                "📅 <strong>Ano de lançamento:</strong> " + ano;

            document.getElementById("exibirNota").innerHTML =
                "⭐ <strong>Sua nota:</strong> " + nota;

            document.getElementById("exibirIdade").innerHTML =
                "🕒 <strong>Idade do filme:</strong> " + idade + " anos";

            document.getElementById("mensagem").innerHTML = mensagem;

            let capa = document.getElementById("capa");

            if (imagem !== "") {
                capa.src = imagem;
                capa.style.display = "block";
            } else {
                capa.style.display = "none";
                capa.src = "";
            }

            document.getElementById("resultado").style.display = "block";

        }

    </script>

</body>
</html>
