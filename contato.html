<body class="d-flex flex-column min-vh-100">
    <header class="container-fluid bg-primary text-white text-center p-4">
        <h1>Jornada de Viagens</h1>
        <p class="Dados Cadastrais">Jornada de viagens ✈️🌍</p>
    </header>

    <nav class="navbar navbar-expand-lg bg-body-tertiary" aria-label="Navegação principal">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">Menu</a>

                    <a class="nav-link" href="pacotes.html">Pacotes de Viagens</a>
                    <a class="nav-link" href="#contato">Contato</a>
                </div>
            </div>
            <form class="d-flex" role="search">
                <input class="form-control me-2" type="search" placeholder="Pesquisar" aria-label="Pesquisar">
                <button class="btn btn-outline-success" type="submit">Pesquisar</button>
            </form>
        </div>
    </nav>

    <!-- Apenas um <main> por página -->
    <main class="flex-fill container my-4">
     
        <form>
            <label for="nome" class="form-label">Nome:</label>
            <input type="text" class="form-control" id=" nome" name="nome" required>

            <label for="senha" class="form-label">Senha:</label>
            <input type="password" class="form-control" id= "senha" name="senha">        

            <label for="email" class="form-label">Email:</label>
            <input type="email" class="form-control" id="email" name="email">

            <label for="mensagem" class="form-label">Mensagem:</label>
            <textarea id="mensagem" class="form-control" name="mensagem"></textarea>

            <select class="form-select mt-2" aria-label="Seleção da escolaridade"
            name="escolaridade" id="escolaridade">
                <option selected>Selecione a escolaridade</option>
                <option value="1">Ensino Médio</option>
                <option value="2">Ensino Superior</option>
                <option value="3">Pós Graduação</option>
                <option value="4">Mestrado ou Doutorado</option>
            </select>
            <div class="form-check">
  <input class="form-check-input" type="checkbox" value="" id="termos">
  <label class="form-check-label" for="termos">
    Aceito os termos e condições
   
  </label>
</div>
<div class="form-check">
  <input class="form-check-input" type="checkbox" value="" id="recEmail" checked
  name="recEmail">
  <label class="form-check-label" for="recEmail">
    Aceito o recebimento de emails
    
  </label>
</div>

            <input type="submit" value="Enviar" class="btn btn-primary">
            <input type="reset" value="Limpar" class="btn btn-danger">
        </form>

    </main>

    <!-- Rodapé -->
